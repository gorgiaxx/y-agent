[package]
name = "y-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Business/service layer for y-agent — shared by CLI, TUI, and future Web API"

[dependencies]
y-core = { workspace = true }
y-bot = { workspace = true }
y-agent = { workspace = true, features = ["dynamic_agent_evolution"] }
y-mcp = { workspace = true }
y-provider = { workspace = true }
y-session = { workspace = true }
y-context = { workspace = true }
y-hooks = { workspace = true }
y-tools = { workspace = true }
y-storage = { workspace = true }
y-runtime = { workspace = true }
y-guardrails = { workspace = true }
y-knowledge = { workspace = true }
y-browser = { workspace = true }
y-scheduler = { workspace = true }
y-journal = { workspace = true }

y-prompt = { workspace = true }
y-diagnostics = { workspace = true }
y-skills = { workspace = true, features = [
    "skill_ingestion",
    "skill_security_screening",
    "skill_transformation",
    "evolution_capture",
    "evolution_extraction",
    "evolution_refinement",
    "skill_usage_audit",
] }

anyhow = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
jsonschema = { workspace = true }
tempfile = "3"
url = "2"
hex = { workspace = true, optional = true }
semver = { version = "1", optional = true }

[features]
default = [
    "agent_swarm",
    "automation_a2a",
    "compaction_prefire",
    "hook_handlers",
    "instance_coordination",
    "worktree_isolation",
]
agent_swarm = ["y-tools/agent_swarm"]
automation_a2a = []
background_auto_wake = []
compaction_prefire = []
capability_packs = ["dep:hex", "dep:semver"]
lsp = ["y-tools/lsp"]
worktree_isolation = ["y-runtime/worktree_isolation"]
hook_handlers = ["y-hooks/hook_handlers"]
instance_coordination = ["y-storage/instance_coordination"]
llm_hooks = ["y-hooks/llm_hooks"]
langfuse = ["y-diagnostics/langfuse"]

[dev-dependencies]
y-test-utils = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
temp-env = "0.3"

[lints]
workspace = true
