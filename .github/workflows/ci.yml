name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-architecture"

      - name: Layering and quality guards
        run: cargo run -p y-xtask -- guard all

      - name: Guard regression test
        run: bash scripts/tests/test-architecture-guards.sh

  workflow-regressions:
    name: Workflow Regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package AppImage script regression test
        run: bash scripts/tests/test-package-linux-appimage-relative-path.sh

      - name: CI frontend gate regression test
        run: bash scripts/tests/test-ci-frontend-gates.sh

      - name: CI and release cache regression test
        run: bash scripts/tests/test-ci-release-cache-gates.sh

      - name: Tauri version family regression test
        run: bash scripts/tests/test-tauri-version-family.sh

      - name: Unified development entrypoint regression test
        run: bash scripts/tests/test-unified-development-entrypoints.sh

      - name: Unified release build regression test
        run: bash scripts/tests/test-build-release-unified.sh

      - name: macOS package layout regression test
        run: bash scripts/tests/test-package-macos-pkg.sh

      - name: macOS release-note package regression test
        run: bash scripts/tests/test-release-notes-macos-pkg.sh

  gui:
    name: GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/y-gui/package-lock.json

      - name: Check lock file in sync
        working-directory: crates/y-gui
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json. Run 'npm install' locally and commit the updated lock file."
            git --no-pager diff --stat package-lock.json
            exit 1
          fi

      - name: Install GUI dependencies
        working-directory: crates/y-gui
        run: npm ci

      - name: Test GUI
        working-directory: crates/y-gui
        run: npm test

      - name: Lint GUI
        working-directory: crates/y-gui
        run: npm run lint

      - name: Build GUI
        working-directory: crates/y-gui
        run: npm run build

      - name: Build GUI web bundle
        working-directory: crates/y-gui
        run: npm run build:web

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-rust"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsqlite3-dev \
            libgtk-3-dev

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace

      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
